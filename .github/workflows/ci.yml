# AdensaOps CI: the same gates a contributor runs locally.
#
#   1. build = tsc --noEmit && vite build && bundle privacy check (the real
#              dataset and PIN hash must never reach dist/)
#   2. unit  = Vitest: business rules, shared metrics, compare and quote maths,
#              components, worker API (sessions, real dataset, records)
#   3. e2e   = Playwright on Chromium in desktop/phone/tablet projects
#
# npm ci honors the lockfile exactly: no drift between what was tested and
# what ships. Vercel additionally refuses to deploy unless npm test passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fail on any lockfile drift instead of silently rewriting it.
      - name: Install dependencies
        run: npm ci

      # Both editions: the public demo and the real platform. Each build runs
      # tsc, vite build and the bundle check for that edition.
      - name: Typecheck and build (app edition)
        run: npm run build:app

      - name: Typecheck and build (demo edition)
        run: npm run build:demo

      # The artifact proves the build produced a servable dist/ and lets
      # you download exactly what CI verified.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  unit:
    name: Unit & component tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

      - name: Upload coverage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ github.sha }}
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser binaries between runs (keyed on the Playwright version).
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # webServer in playwright.config.ts starts the Vite dev server itself.
      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
