<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- First Light mark: vector where supported, PNG/ICO elsewhere. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0E1B2C" />
    <meta name="theme-color" content="#F6F5F1" />
    <title>AdensaOps · Operations and procurement for Adensa Supply &amp; Logistics</title>
    <meta name="description" content="AdensaOps is the operations and procurement platform for Adensa Supply &amp; Logistics Ltd, a building-materials supplier in Accra: quotes, orders, supplier price comparison and cash, built with React and TypeScript." />
    <meta name="author" content="Selasey Gbeddy" />
    <link rel="canonical" href="https://adensaops.com/" />
    <!-- Social preview (generated by npm run brand:assets) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdensaOps" />
    <meta property="og:title" content="AdensaOps · Your project. Our procurement." />
    <meta property="og:description" content="Operations and procurement platform for a building-materials supplier in Accra. React, TypeScript, Cloudflare D1." />
    <meta property="og:url" content="https://adensaops.com/" />
    <meta property="og:image" content="https://adensaops.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AdensaOps: Your project. Our procurement." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AdensaOps · Your project. Our procurement." />
    <meta name="twitter:description" content="Operations and procurement platform for a building-materials supplier in Accra." />
    <meta name="twitter:image" content="https://adensaops.com/og-image.png" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('adensa.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          // Phone and tablet browsers tint the browser chrome with theme-color:
          // keep it on the active canvas so the chrome matches the page.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0A1220' : '#F6F5F1');
        } catch (e) {
          /* storage unavailable — stay on light */
        }
      })();
    </script>
    <style>
      /* ---- Loading splash: pure HTML/CSS so it paints before the JS bundle,
              even on a slow connection. React fades it out on mount; if the
              bundle never arrives it simply keeps pulsing. ---- */
      #adensa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        overflow: hidden;
        background: #0a1220;
        transition: opacity 600ms ease;
      }
      #adensa-splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      /* Faint drifting glow field — the "eyes active" background, zero bytes
         of video so it never competes with the bundle on a laggy network. */
      #adensa-splash::before,
      #adensa-splash::after {
        content: '';
        position: absolute;
        width: 130vmax;
        height: 130vmax;
        border-radius: 50%;
        filter: blur(10px);
        opacity: 0.5;
      }
      #adensa-splash::before {
        background: radial-gradient(circle at 30% 35%, rgba(47, 111, 219, 0.2) 0%, transparent 45%);
        animation: splash-drift-a 16s ease-in-out infinite alternate;
      }
      #adensa-splash::after {
        background: radial-gradient(circle at 70% 65%, rgba(212, 162, 30, 0.16) 0%, transparent 42%);
        animation: splash-drift-b 20s ease-in-out infinite alternate;
      }
      /* Giant slow-panning wordmark watermark. */
      #adensa-splash .splash-watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Poppins, 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        font-size: 24vmin;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        color: rgba(246, 242, 234, 0.035);
        user-select: none;
        pointer-events: none;
        animation: splash-pan 26s ease-in-out infinite alternate;
      }
      #adensa-splash .splash-core {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      #adensa-splash svg {
        width: min(300px, 64vw);
        height: auto;
        filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.45));
      }
      #adensa-splash .splash-tagline {
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
        font-weight: 600;
        font-size: clamp(18px, 4.2vw, 26px);
        letter-spacing: -0.01em;
        text-align: center;
        color: #f6f2ea;
      }
      /* Indeterminate loading bar. */
      #adensa-splash .splash-track {
        width: min(240px, 56vw);
        height: 4px;
        border-radius: 999px;
        background: rgba(246, 242, 234, 0.14);
        overflow: hidden;
      }
      #adensa-splash .splash-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #d4a21e;
        animation: splash-load 1.4s ease-in-out infinite;
      }
      @keyframes splash-load {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }
      @keyframes splash-drift-a {
        from { transform: translate(-18%, -12%) scale(1); }
        to { transform: translate(14%, 10%) scale(1.15); }
      }
      @keyframes splash-drift-b {
        from { transform: translate(16%, 14%) scale(1.1); }
        to { transform: translate(-12%, -8%) scale(0.95); }
      }
      @keyframes splash-pan {
        from { transform: translateX(-4%) scale(1); }
        to { transform: translateX(4%) scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        #adensa-splash::before,
        #adensa-splash::after,
        #adensa-splash .splash-watermark,
        #adensa-splash .splash-fill {
          animation-duration: 4s;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen: visible the instant the link opens, on any platform. -->
    <div id="adensa-splash" role="status" aria-label="Loading AdensaOps">
      <div class="splash-watermark" aria-hidden="true">ADENSA</div>
      <div class="splash-core">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" role="img" aria-label="Adensa Supply and Logistics">
          <g transform="translate(10 10) scale(0.394) translate(-140 -160)">
  <path d="M 264 278 A 56 56 0 0 1 376 278 Z" fill="#D4A21E"/>
  <line x1="382.35" y1="242" x2="406.6" y2="228" stroke="#D4A21E" stroke-width="13" stroke-linecap="round"/>
  <line x1="356" y1="215.65" x2="370" y2="191.4" stroke="#D4A21E" stroke-width="13" stroke-linecap="round"/>
  <line x1="320" y1="206" x2="320" y2="178" stroke="#D4A21E" stroke-width="13" stroke-linecap="round"/>
  <line x1="284" y1="215.65" x2="270" y2="191.4" stroke="#D4A21E" stroke-width="13" stroke-linecap="round"/>
  <line x1="257.65" y1="242" x2="233.4" y2="228" stroke="#D4A21E" stroke-width="13" stroke-linecap="round"/>
  <rect x="204" y="305" width="232" height="72" rx="12" fill="#F6F2EA"/>
  <rect x="152" y="403" width="336" height="72" rx="12" fill="#F6F2EA"/>
          </g>
          <text x="170" y="80" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="54" letter-spacing="7" fill="#F6F2EA">ADENSA</text>
          <text x="172" y="108" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="5.6" fill="#D4A21E">SUPPLY &amp; LOGISTICS</text>
        </svg>
        <div class="splash-tagline">Your project. Our procurement.</div>
        <div class="splash-track" aria-hidden="true"><div class="splash-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
